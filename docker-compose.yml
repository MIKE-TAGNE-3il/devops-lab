# Stack applicative du DevOps Lab.
# Services : db (PostgreSQL), migrate (migrations Alembic, usage unique), backend (API),
# frontend (application React servie par Nginx).
# Ordre de démarrage : db healthy -> migrate terminé avec succès -> backend healthy -> frontend.
#
# Ce fichier est celui de la PRODUCTION : aucun port publié, le trafic arrive par Traefik
# (réseau externe traefik-public, créé par Ansible). Pour travailler sur le PC, ajouter les
# ports avec docker-compose.dev.yml (voir "make dev").

# URL de la base, définie UNE fois (ancre YAML &database-url) puis réutilisée par
# migrate et backend avec *database-url. Le mot de passe n'est écrit qu'à un seul endroit.
# "db" est le nom du service : le DNS interne de Compose le résout vers le conteneur
# PostgreSQL. Ne jamais mettre "localhost" : dans un conteneur, c'est le conteneur lui-même.
x-database-url: &database-url postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

services:
  db:
    # Version majeure épinglée (16), jamais "latest" : une montée silencieuse vers une
    # autre version majeure rendrait illisibles les données déjà stockées dans le volume.
    image: postgres:16-alpine

    # Redémarre après un crash ou un reboot du serveur, mais pas après un "docker compose stop".
    restart: unless-stopped

    environment:
      # ${VAR:?message} : compose refuse de démarrer si la variable est absente du .env,
      # au lieu de créer une base avec un mot de passe vide.
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant dans .env}

    # Volume nommé : les données survivent à la suppression du conteneur.
    volumes:
      - db_data:/var/lib/postgresql/data

    # Uniquement sur le réseau interne : ni Traefik ni un futur service ne peuvent la joindre.
    networks:
      - internal

    # "Prêt" = PostgreSQL accepte les connexions. Le "$$" laisse passer un "$" que le shell
    # DU CONTENEUR remplace par ses propres variables ; avec un seul "$", c'est compose
    # qui substituerait, depuis le .env de l'hôte.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    # Pas de "ports:" volontairement : la base n'est joignable que par les autres
    # conteneurs de la stack, jamais depuis l'hôte ni depuis Internet.

  migrate:
    # Même image que le backend (même Dockerfile, mêmes couches en cache), mais une autre commande.
    build: ./backend
    image: devops-lab-backend:dev

    # Tâche ponctuelle : applique les migrations puis le conteneur s'arrête (code 0).
    # alembic upgrade head est idempotent : relancé sur une base à jour, il ne fait rien.
    command: ["alembic", "upgrade", "head"]

    # Jamais de redémarrage automatique : une migration ne doit pas se relancer en boucle.
    restart: "no"

    environment:
      DATABASE_URL: *database-url

    # Le HEALTHCHECK du Dockerfile interroge le port 8000 : ici il n'y a pas de serveur,
    # le conteneur serait déclaré "unhealthy" pour rien.
    healthcheck:
      disable: true

    # Réseau interne seulement : il n'a besoin que de la base.
    networks:
      - internal

    depends_on:
      db:
        condition: service_healthy

  backend:
    # Construit l'image depuis backend/Dockerfile (contrairement à db, image toute faite).
    build: ./backend
    image: devops-lab-backend:dev

    restart: unless-stopped

    environment:
      DATABASE_URL: *database-url

    # Pas de "ports:" : Traefik atteint ce conteneur par le réseau traefik-public.

    # Le backend est le seul pont entre les deux zones : "internal" pour joindre la base,
    # "traefik-public" pour être joignable par Traefik (et par le proxy Nginx du frontend).
    networks:
      - internal
      - traefik-public

    labels:
      # Traefik est configuré avec exposedbydefault=false : sans ce label, il ignore le conteneur.
      - "traefik.enable=true"
      # Le backend est sur deux réseaux : on précise celui que Traefik doit utiliser.
      - "traefik.docker.network=traefik-public"
      # /api va au backend. La règle du frontend couvre tout le domaine, /api compris : la
      # priorité plus haute (100) garantit que le backend l'emporte.
      - "traefik.http.routers.app-api.rule=Host(`app.${DOMAIN:?DOMAIN manquant dans .env}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.app-api.priority=100"
      - "traefik.http.routers.app-api.entrypoints=websecure"
      - "traefik.http.routers.app-api.tls.certresolver=le"
      - "traefik.http.services.app-api.loadbalancer.server.port=8000"

    # Ne démarre qu'une fois la base "healthy" ET les migrations terminées avec succès :
    # l'API ne sert jamais de requêtes sur un schéma incomplet.
    # Valable au démarrage seulement : si la base tombe ensuite, c'est pool_pre_ping qui
    # rétablit la connexion, et Docker ne redémarre pas le backend pour autant.
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    # Même commande que le HEALTHCHECK du Dockerfile : ce bloc la remplace et permet d'ajuster
    # les délais par environnement sans reconstruire l'image.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    # Nginx non-root qui sert l'application React compilée (voir frontend/Dockerfile).
    build: ./frontend
    image: devops-lab-frontend:dev

    restart: unless-stopped

    # Pas de "ports:" : c'est Traefik (ports 80 et 443) qui sert l'application.

    # Seulement sur traefik-public, avec le backend. Il n'est PAS sur "internal" :
    # il ne peut pas joindre la base de données.
    networks:
      - traefik-public

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      # app.<domaine> sert l'application ; /api est capté avant par le routeur du backend.
      - "traefik.http.routers.app-frontend.rule=Host(`app.${DOMAIN:?DOMAIN manquant dans .env}`)"
      - "traefik.http.routers.app-frontend.entrypoints=websecure"
      - "traefik.http.routers.app-frontend.tls.certresolver=le"
      - "traefik.http.services.app-frontend.loadbalancer.server.port=8080"

    # Le proxy Nginx /api a besoin du backend : on attend qu'il soit prêt.
    depends_on:
      backend:
        condition: service_healthy

    # Même commande que le HEALTHCHECK du Dockerfile (wget existe dans l'image alpine).
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db_data:

networks:
  # internal: true = aucun accès à Internet depuis ce réseau et aucun port publiable.
  # Si la base était compromise, elle ne pourrait pas exfiltrer de données vers l'extérieur.
  internal:
    internal: true

  # Réseau de Traefik, créé par Ansible sur le serveur (external : compose ne le crée pas).
  # Sur le PC, le créer une fois avec : docker network create traefik-public
  traefik-public:
    external: true
