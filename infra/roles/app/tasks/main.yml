---
# Rôle "app" : utilisateur de déploiement de la CI, dossier de l'application et script
# de déploiement. Toutes les tâches sont idempotentes.
# À exécuter APRÈS le rôle docker : le groupe "docker" doit déjà exister.

- name: Check that the CI public key is defined
  ansible.builtin.assert:
    that:
      - ci_deploy_public_key is defined
      - ci_deploy_public_key | length > 0
    fail_msg: >-
      Define ci_deploy_public_key in group_vars/all/all.yml
      (public key of the GitHub Actions deploy key pair).

# Le shell doit rester /bin/bash : avec une commande forcée, sshd exécute le script
# PAR le shell de l'utilisateur ("$SHELL -c script"). /usr/sbin/nologin le bloquerait.
# Le groupe docker permet au script de piloter Docker ; il n'y a volontairement ni groupe
# sudo ni fichier sudoers pour cet utilisateur.
- name: Create CI deploy user without sudo
  ansible.builtin.user:
    name: "{{ app_ci_user }}"
    groups: docker
    append: true
    shell: /bin/bash
    create_home: true
    state: present

- name: Create .ssh directory for the CI user
  ansible.builtin.file:
    path: "/home/{{ app_ci_user }}/.ssh"
    state: directory
    owner: "{{ app_ci_user }}"
    group: "{{ app_ci_user }}"
    mode: "0700"

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_ci_user }}"
    group: "{{ app_ci_user }}"
    # 0750 : le futur fichier .env (mots de passe) n'est lisible par aucun autre utilisateur.
    mode: "0750"

# Le compose de production est posé par Ansible, pas envoyé par la CI : une clé volée ne peut
# donc pas faire exécuter au serveur un compose de son choix (conteneur privileged, montage
# de /...). Le script de déploiement refuse si ce fichier diffère de celui du commit déployé
# (contrôle de dérive) : après une modification du compose, relancer ce playbook.
# Propriétaire root : l'utilisateur de la CI le lit mais ne peut pas le modifier.
- name: Install the production docker-compose.yml
  ansible.builtin.copy:
    src: "{{ app_compose_src }}"
    dest: "{{ app_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

# Propriétaire root : l'utilisateur de la CI peut exécuter le script mais pas le modifier.
# Sans cela, une clé volée pourrait réécrire le script et sortir de sa restriction.
- name: Install the forced deploy script
  ansible.builtin.template:
    src: deploy-app.sh.j2
    dest: "{{ app_deploy_script }}"
    owner: root
    group: root
    mode: "0755"

# restrict         : désactive terminal, redirections de ports, agent et X11.
# command="..."    : quoi que le client demande, sshd lance CE script ; la demande du client
#                    arrive dans la variable SSH_ORIGINAL_COMMAND.
- name: Authorize the CI public key with a forced command
  ansible.posix.authorized_key:
    user: "{{ app_ci_user }}"
    key: "{{ ci_deploy_public_key }}"
    key_options: 'restrict,command="{{ app_deploy_script }}"'
    state: present
