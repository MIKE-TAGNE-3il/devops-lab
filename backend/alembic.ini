[alembic]
# Dossier des migrations (nommé "migrations" pour ne pas se confondre avec la bibliothèque alembic).
script_location = migrations

# Ajoute le dossier courant au chemin Python : sans cela, "import app" échoue quand on
# lance la commande alembic (le chemin de l'exécutable alembic est utilisé, pas le dossier courant).
prepend_sys_path = .

# L'URL de la base n'est volontairement PAS ici : pas de mot de passe dans un fichier versionné.
# migrations/env.py la lit dans la variable d'environnement DATABASE_URL.
