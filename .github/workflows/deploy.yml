# CD manuel — (re)déploiement d'un commit précis sur le VPS.
# Onglet Actions > Deploy > Run workflow, avec le SHA d'un commit dont les images sont déjà
# publiées sur GHCR : redéploiement, ou retour arrière manuel vers une version choisie.
#
# Le déploiement automatique (push vers main) est dans ci.yml. Les deux utilisent la même
# action composite (.github/actions/deploy), exécutée dans un job qui déclare l'Environment
# "production" : c'est lui qui fournit les secrets (clé SSH, empreinte du serveur) et les
# variables (hôte, port, utilisateur, domaine), limités à la branche main.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: SHA complet (40 caractères) du commit à déployer (images déjà publiées sur GHCR)
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Déployer sur le VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Un seul déploiement à la fois, partagé avec ci.yml (même groupe), et on n'interrompt
    # jamais celui qui est en cours : couper un déploiement au milieu laisserait le serveur
    # dans un état incertain.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://${{ vars.APP_DOMAIN }}
    steps:
      # On récupère le commit déployé : son docker-compose.yml sert au contrôle de dérive.
      - name: Récupérer le code du commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Déployer
        uses: ./.github/actions/deploy
        with:
          sha: ${{ inputs.sha }}
          ssh-host: ${{ vars.SSH_HOST }}
          ssh-port: ${{ vars.SSH_PORT }}
          ssh-user: ${{ vars.SSH_USER }}
          app-domain: ${{ vars.APP_DOMAIN }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

  # Alerte Discord pour un déploiement lancé à la main (même contenu que celle de ci.yml).
  notify-failure:
    name: Notification Discord (échec)
    needs: deploy
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      SHA: ${{ inputs.sha }}
      AUTEUR: ${{ github.actor }}
      DEPOT: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Envoyer l'alerte sur Discord
        run: |
          if [[ -z "$DISCORD_WEBHOOK" ]]; then
            echo "::warning::Secret DISCORD_WEBHOOK absent : notification ignorée"
            exit 0
          fi
          payload=$(jq -n \
            --arg sha "${SHA:0:7}" \
            --arg auteur "$AUTEUR" \
            --arg depot "$DEPOT" \
            --arg url "$RUN_URL" \
            '{
              username: "GitHub Actions",
              embeds: [{
                title: "Déploiement manuel en échec",
                url: $url,
                color: 15548997,
                fields: [
                  {name: "Version demandée", value: ("`" + $sha + "`")},
                  {name: "Lancé par", value: $auteur, inline: true},
                  {name: "Dépôt", value: $depot, inline: true}
                ]
              }]
            }')
          curl --fail --silent --show-error --retry 3 \
            --header 'Content-Type: application/json' \
            --data "$payload" "$DISCORD_WEBHOOK"
          echo "Alerte envoyée."
