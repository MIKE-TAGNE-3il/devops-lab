# CI — intégration continue.
# Se déclenche sur chaque pull request et sur chaque push vers main.
# Ordre "fail fast" : lint (backend et frontend en parallèle) -> tests -> (étape suivante :
# build des images, scan Trivy, publication sur GHCR). Un job ne démarre que si les précédents
# sont verts, donc une erreur de style coûte 30 secondes et non un build complet.
#
# Les actions sont épinglées par SHA de commit (le tag en commentaire est celui du SHA) :
# un tag peut être déplacé par son auteur, pas un SHA. Dependabot pourra les mettre à jour.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Droits du jeton automatique GITHUB_TOKEN : lecture seule par défaut.
# Un job qui a besoin de plus (publier sur GHCR) le demandera lui-même.
permissions:
  contents: read

# Une seule exécution par branche. Sur une PR, un nouveau push annule l'exécution devenue
# inutile ; sur main on laisse chaque commit aller au bout (il sera déployé).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-backend:
    name: Lint backend (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ne laisse pas le jeton dans .git/config : aucune étape suivante n'en a besoin.
          persist-credentials: false

      - name: Installer Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Même version que l'image de production (python:3.12-slim).
          python-version: "3.12"
          # Cache pip, invalidé quand requirements-dev.txt change.
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Installer les dépendances de développement
        working-directory: backend
        run: pip install -r requirements-dev.txt

      # Les deux commandes de "make lint" : règles de lint, puis mise en forme.
      - name: Ruff — règles de lint
        working-directory: backend
        run: ruff check .

      - name: Ruff — mise en forme
        working-directory: backend
        run: ruff format --check .

  lint-frontend:
    name: Lint frontend (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Même version que l'image de build du frontend (node:24-alpine).
          node-version: "24"
          # Cache du dossier npm, invalidé quand package-lock.json change.
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci (et non npm install) : versions exactes du lockfile, échec s'il est désynchronisé.
      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

  test:
    name: Tests backend (pytest)
    # Ne démarre que si les deux lint sont verts (fail fast).
    needs: [lint-backend, lint-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Installer les dépendances de développement
        working-directory: backend
        run: pip install -r requirements-dev.txt

      # Base SQLite en mémoire (voir tests/conftest.py) : aucun service PostgreSQL nécessaire.
      - name: Pytest
        working-directory: backend
        run: pytest
