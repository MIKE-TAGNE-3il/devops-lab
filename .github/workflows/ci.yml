# CI — intégration continue.
# Se déclenche sur chaque pull request et sur chaque push vers main.
# Ordre "fail fast" : lint (backend et frontend en parallèle) -> tests -> build des images,
# scan Trivy, publication sur GHCR. Un job ne démarre que si les précédents sont verts, donc
# une erreur de style coûte 30 secondes et non un build complet.
# Les images ne sont publiées que sur un push vers main ; sur une PR on construit et on scanne
# (pour valider les Dockerfiles et la sécurité avant la fusion) sans rien publier.
# Sur main, un dernier job appelle deploy.yml pour mettre les images en production.
#
# Les actions sont épinglées par SHA de commit (le tag en commentaire est celui du SHA) :
# un tag peut être déplacé par son auteur, pas un SHA. Dependabot pourra les mettre à jour.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Droits du jeton automatique GITHUB_TOKEN : lecture seule par défaut.
# Un job qui a besoin de plus (publier sur GHCR) le demandera lui-même.
permissions:
  contents: read

# Une seule exécution par branche. Sur une PR, un nouveau push annule l'exécution devenue
# inutile ; sur main on laisse chaque commit aller au bout (il sera déployé).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-backend:
    name: Lint backend (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ne laisse pas le jeton dans .git/config : aucune étape suivante n'en a besoin.
          persist-credentials: false

      - name: Installer Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Même version que l'image de production (python:3.12-slim).
          python-version: "3.12"
          # Cache pip, invalidé quand requirements-dev.txt change.
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Installer les dépendances de développement
        working-directory: backend
        run: pip install -r requirements-dev.txt

      # Les deux commandes de "make lint" : règles de lint, puis mise en forme.
      - name: Ruff — règles de lint
        working-directory: backend
        run: ruff check .

      - name: Ruff — mise en forme
        working-directory: backend
        run: ruff format --check .

  lint-frontend:
    name: Lint frontend (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Même version que l'image de build du frontend (node:24-alpine).
          node-version: "24"
          # Cache du dossier npm, invalidé quand package-lock.json change.
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci (et non npm install) : versions exactes du lockfile, échec s'il est désynchronisé.
      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

  test:
    name: Tests backend (pytest)
    # Ne démarre que si les deux lint sont verts (fail fast).
    needs: [lint-backend, lint-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Installer les dépendances de développement
        working-directory: backend
        run: pip install -r requirements-dev.txt

      # Base SQLite en mémoire (voir tests/conftest.py) : aucun service PostgreSQL nécessaire.
      - name: Pytest
        working-directory: backend
        run: pytest

  build-scan-push:
    name: Image ${{ matrix.service }} (build, scan, push)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Droits propres à ce job (ils remplacent ceux du niveau workflow, d'où contents: read).
    permissions:
      contents: read
      packages: write # publier sur GHCR
      security-events: write # envoyer le rapport Trivy à l'onglet Security
    strategy:
      # Un échec sur le backend ne doit pas masquer l'état du frontend : on veut voir les deux.
      fail-fast: false
      matrix:
        service: [backend, frontend]
    env:
      # Nom en minuscules : GHCR refuse les majuscules (le compte est MIKE-TAGNE-3il).
      IMAGE: ghcr.io/mike-tagne-3il/devops-lab-${{ matrix.service }}
      # Publication uniquement sur un push vers main (jamais sur une PR, fork compris).
      PUBLIER: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Construit l'image SANS la publier (push: false) : elle est chargée dans le Docker du
      # runner (load: true) pour être scannée avant toute publication.
      - name: Construire l'image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          # Le serveur Hetzner est en x86_64 : même architecture que le runner, pas d'émulation.
          platforms: linux/amd64
          load: true
          push: false
          # Le SHA du commit identifie l'image (jamais "latest") : il permet le rollback.
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # Cache des couches Docker dans GitHub Actions, séparé par service.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          # Rattache l'image au dépôt dans GHCR (visible sur la page du paquet).
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # Pas d'attestation : elle transformerait l'image en index multi-manifestes.
          provenance: false

      # Rapport complet au format SARIF pour l'onglet Security (exit-code 0 : ce passage
      # ne bloque pas, le portail est l'étape suivante). Uniquement sur main.
      - name: Trivy — rapport pour l'onglet Security
        if: env.PUBLIER == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Même version de Trivy que celle testée en local.
          version: v0.76.1
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: "0"

      - name: Envoyer le rapport à l'onglet Security
        if: env.PUBLIER == 'true'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      # LE PORTAIL : échoue (exit-code 1) sur toute faille HIGH ou CRITICAL pour laquelle un
      # correctif existe. ignore-unfixed évite de bloquer sur ce qu'on ne peut pas corriger.
      - name: Trivy — portail de sécurité
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Se connecter à GHCR
        if: env.PUBLIER == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Jeton automatique du workflow : aucun secret à créer (droit packages: write ci-dessus).
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker push (et non une nouvelle construction) : on publie EXACTEMENT l'image scannée.
      - name: Publier l'image sur GHCR
        if: env.PUBLIER == 'true'
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          echo "Image publiée : \`$IMAGE:$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"

  # Déploiement en production : uniquement après la publication des DEUX images (needs sur
  # toute la matrice) et uniquement sur un push vers main. Le détail est dans deploy.yml.
  deploy:
    name: Déploiement en production
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ github.sha }}

  # Alerte Discord : si un job de cette exécution échoue sur main, un message part dans le
  # salon (une PR en échec se voit déjà dans l'interface GitHub, inutile de la notifier).
  # failure() est vrai dès qu'un job listé dans "needs" a échoué ; les jobs ignorés (déploiement
  # sauté après un lint en échec) ne comptent pas comme des échecs.
  notify-failure:
    name: Notification Discord (échec)
    needs: [lint-backend, lint-frontend, test, build-scan-push, deploy]
    if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Aucun droit sur le dépôt : ce job n'appelle que Discord.
    permissions: {}
    env:
      # Secret de DÉPÔT (pas de l'Environment : ce job ne déploie rien). Un webhook ne permet
      # que de poster dans un salon. Les valeurs passent par l'environnement, jamais par "${{ }}"
      # dans le script : le message du commit est du texte libre.
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      NEEDS: ${{ toJSON(needs) }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      COMMIT_SHA: ${{ github.sha }}
      AUTEUR: ${{ github.actor }}
      DEPOT: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Envoyer l'alerte sur Discord
        run: |
          if [[ -z "$DISCORD_WEBHOOK" ]]; then
            echo "::warning::Secret DISCORD_WEBHOOK absent : notification ignorée"
            exit 0
          fi
          # Noms des jobs en échec, tirés du contexte "needs".
          echecs=$(jq -r 'to_entries | map(select(.value.result == "failure")) | map(.key) | join(", ")' <<<"$NEEDS")
          # Première ligne du message de commit seulement, tronquée (limites de Discord).
          message="${COMMIT_MESSAGE%%$'\n'*}"
          message="${message:0:200}"
          # jq construit le JSON : guillemets et retours à la ligne sont échappés correctement.
          payload=$(jq -n \
            --arg echecs "${echecs:-inconnu}" \
            --arg message "$message" \
            --arg sha "${COMMIT_SHA:0:7}" \
            --arg auteur "$AUTEUR" \
            --arg depot "$DEPOT" \
            --arg url "$RUN_URL" \
            '{
              username: "GitHub Actions",
              embeds: [{
                title: "Pipeline en échec sur main",
                url: $url,
                color: 15548997,
                fields: [
                  {name: "Jobs en échec", value: $echecs},
                  {name: "Commit", value: ("`" + $sha + "` " + $message)},
                  {name: "Auteur", value: $auteur, inline: true},
                  {name: "Dépôt", value: $depot, inline: true}
                ]
              }]
            }')
          curl --fail --silent --show-error --retry 3 \
            --header 'Content-Type: application/json' \
            --data "$payload" "$DISCORD_WEBHOOK"
          echo "Alerte envoyée."
