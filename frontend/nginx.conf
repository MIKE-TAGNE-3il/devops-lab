# Configuration Nginx du frontend (copiée dans /etc/nginx/conf.d/default.conf).

server {
    # 8080 : l'image tourne sans être root, elle ne peut pas ouvrir le port 80.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # N'affiche pas la version de Nginx dans les réponses et les pages d'erreur.
    server_tokens off;

    # En-têtes de sécurité. "always" : ajoutés aussi aux réponses d'erreur.
    # Attention : un add_header dans un bloc location ANNULE ceux du bloc server. On n'en
    # met donc dans aucun location ; pour le cache on utilise "expires", qui n'est pas concerné.
    # (HSTS sera ajouté par Traefik, qui gère le HTTPS.)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;

    # Proxy vers le backend : la page et l'API sont ainsi sur le même domaine (pas de CORS).
    # En production, Traefik envoie /api directement au backend : cette règle ne sert que
    # quand on utilise le frontend sans Traefik (test local avec docker compose).
    location /api/ {
        # 127.0.0.11 = DNS interne de Docker. Avec une variable dans proxy_pass, Nginx résout
        # "backend" à CHAQUE requête (cache de 10 s). Sans cela, il le résout une seule fois au
        # démarrage : si le backend est recréé (nouvelle adresse IP), Nginx enverrait toujours
        # vers l'ancienne et renverrait des erreurs 502 jusqu'à son redémarrage.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        # Pas de partie URI après la variable : /api/items est transmis tel quel au backend.
        proxy_pass $backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers produits par Vite : leur nom contient un hash du contenu, donc un fichier ne
    # change jamais sous le même nom. On peut les garder en cache un an.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Application à page unique : toute adresse inconnue renvoie index.html et c'est le
    # JavaScript (le routeur React) qui gère l'URL. index.html lui-même ne doit pas être
    # mis en cache longtemps, sinon un client garderait une ancienne version de l'application.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
